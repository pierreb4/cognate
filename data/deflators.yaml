# Deflators — dated, sourced price series for re-reading an aged price.
#
# A price in this register is NOMINAL: it is what was paid, in the dollars of its row's
# `date:`. Nothing here ever rewrites a row, and no label moves on a schedule — a measured
# row is a primary fact, and a `cost:` band that drifted would stop being checkable against
# the row that justifies it. These series exist so `build_graph.py --as-of <date>` can print,
# beside the nominal price, what the same run would cost at a later date; and so the discount
# is a sourced claim carrying its own vintage rather than a constant assumed inside a script.
# See SCHEMA.md, "`cost:` ages".
#
# Three currencies age at three rates, so one rate would be wrong for two of them.
# `applies_to` names which rows a series governs; the currency is read off `regime:`.
#
# A series carries BASES — one per primary or per vendor — because the sources disagree, and
# the disagreement is the finding. `status: contested` makes `--as-of` print a RANGE across
# bases and never a point estimate. A basis states the span its primary actually measured
# (`covers_from`/`covers_to`); outside it the view prints EXTRAPOLATED, because both API
# primaries stop before 2026 and this corpus holds 2026 rows.
series:
  - id: api-inference-price-at-fixed-capability
    applies_to: api-usd-per-task
    unit: relative-index
    status: contested
    deflates: true
    note: >-
      USD to reach a FIXED capability level through a vendor API. The two primaries disagree
      by an order of magnitude and say so about each other, so this series deflates to a
      range, not a number. Both measure the price of a fixed BENCHMARK THRESHOLD, not of a
      fixed model — which is the right quantity for an aged row, and also the reason the
      rates are so large: a threshold is met by cheaper models over time, not only by price
      cuts. Neither primary's data reaches 2026.
    bases:
      - id: epoch-2025-03-median
        source: https://epoch.ai/data-insights/llm-inference-price-trends
        covers_from: 2021-11
        covers_to: 2025-02
        note: >-
          Epoch AI, published 2025-03-12: "Across all of these benchmarks and performance
          thresholds, we found prices declining between 9x per year and 900x per year, with a
          median of 50x per year." The 9x-900x is a spread ACROSS six benchmark thresholds
          (MMLU, GPQA Diamond, MATH-500, MATH L5, HumanEval, Chatbot Arena), not an error bar;
          the median is banked here. A widely repeated "200x per year since January 2024" does
          NOT appear on the page and is not carried.
      - id: mit-futuretech-2026-03-fast
        source: https://arxiv.org/abs/2511.23455
        covers_from: 2024-04
        covers_to: 2025-11
        note: >-
          Gundlach, Lynch, Mertens & Thompson (MIT FutureTech), "The Price of Progress",
          v2 2026-03-23: 5x-10x per year at fixed benchmark performance over April 2024 to
          November 2025. The fast end of their range. They name the gap with Epoch directly,
          calling it substantially less than the reported upper bound of Cottier et al. (2025).
      - id: mit-futuretech-2026-03-slow
        source: https://arxiv.org/abs/2511.23455
        covers_from: 2024-04
        covers_to: 2025-11
        note: The slow end of the same paper's range, banked so the view's floor is sourced too.
    points:
      - basis: epoch-2025-03-median
        as_of: 2024-02
        value: 50.0
        source: https://epoch.ai/data-insights/llm-inference-price-trends
        note: >-
          the pair encodes the published RATE (50x in one year), dated at the end of the
          primary's own data span; the view reads between and beyond them log-linearly
      - basis: epoch-2025-03-median
        as_of: 2025-02
        value: 1.0
        source: https://epoch.ai/data-insights/llm-inference-price-trends
      - basis: mit-futuretech-2026-03-fast
        as_of: 2024-11
        value: 10.0
        source: https://arxiv.org/abs/2511.23455
      - basis: mit-futuretech-2026-03-fast
        as_of: 2025-11
        value: 1.0
        source: https://arxiv.org/abs/2511.23455
      - basis: mit-futuretech-2026-03-slow
        as_of: 2024-11
        value: 5.0
        source: https://arxiv.org/abs/2511.23455
      - basis: mit-futuretech-2026-03-slow
        as_of: 2025-11
        value: 1.0
        source: https://arxiv.org/abs/2511.23455

  - id: gpu-hour-price
    applies_to: gpu-hour
    unit: usd-per-gpu-hour
    status: contested
    deflates: false
    note: >-
      On-demand cloud USD per accelerator-hour. Banked as evidence and NOT used to deflate,
      because the 2026-09-06 fetch found no single index to deflate BY: over 2024 to 2026 AWS
      cut A100 by a third and H100 by 44% while leaving L4 untouched, Lambda's on-demand LIST
      PRICES ROSE on every class checked, and RunPod fell mildly — and on one day the same
      chip spans about 2.5x across vendors (H100 80GB on 2026-09-06: AWS $6.88 against RunPod
      Community $2.69). "GPU compute keeps getting cheaper" is true of AWS's large parts and
      false of Lambda's list, so a row denominated in hours is left in hours. What a reader
      needs is the vendor and tier, and those are here to be read per row by hand.
    bases:
      - id: aws-on-demand-us-east-1
        source: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/index.csv
        covers_from: 2024-07
        covers_to: 2026-09
        note: >-
          AWS's own machine-readable price list, us-east-1, Linux, Shared tenancy, on-demand,
          divided to per-GPU. The file self-dates in row 3 (2024-07-03 snapshot against
          2026-09-04 live), so both endpoints carry the vendor's own publication date.
      - id: lambda-list-on-demand
        source: https://lambda.ai/service/gpu-cloud
        covers_from: 2024-05
        covers_to: 2026-09
        note: >-
          Lambda's published on-demand list price (2024-05-28 Wayback snapshot against the
          live page). Every class checked went UP; the single-GPU rows rise too, so it is not
          a units artefact.
      - id: runpod-secure-cloud
        source: https://www.runpod.io/pricing
        covers_from: 2024
        covers_to: 2026-09
        note: RunPod Secure Cloud tier. Mild declines; the Community tier is cheaper again.
