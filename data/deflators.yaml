  - id: competition-cost-cap
    applies_to: fixed-cap
    unit: usd-per-task
    status: banked
    deflates: false
    note: >-
      Declared so the view states WHY a cap is left alone rather than silently skipping it.
      A cap is a rule, not a price: nominal by construction, never deflated. What changes is
      what it BUYS, and the regime strings already record that.
